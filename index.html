<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Countries</title>
    <link rel="stylesheet" href="./css/normalize.css" />

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <nav class="navbar container">
        <div class="hero-text">Where in the world?</div>
        <button class="btn" id="btn">
          <!-- <img class="img-icon" src="./images/Path.png" alt="" /> -->
          <p>Dark mode</p>
        </button>
      </nav>
    </header>
    <main>
      <form id="form ">
        <div class="search container">
          <input
            id="search"
            class="input-search"
            type="search"
            placeholder="  Search for a country…"
          />

          <select class="filter-regions" name="" id="regions">
            <option class="filter-region" value="">Filter by region</option>
            <option class="filter-region" value="Europe">Europe</option>
            <option class="filter-region" value="Asia">Asia</option>
            <option class="filter-region" value="Americas">Americas</option>
            <option class="filter-region" value="Africa">Africa</option>
            <option class="filter-region" value="Oceania">Oceania</option>
          </select>
        </div>
      </form>

      <div class="wrapper container" id="cards"></div>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
